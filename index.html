<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="theme-color" content="#111113"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Catálogo"/>
  <title>Catálogo</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="app">

  <!-- SPLASH -->
  <div id="splash">
    <div class="splash-icon">◉</div>
    <div class="splash-name">Catálogo</div>
  </div>

  <!-- HOME: CATEGORIES -->
  <div id="viewHome" class="view active">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-icon">◉</span>
        <span class="brand-name" id="homeTitle">Catálogo</span>
      </div>
      <div class="topbar-actions">
        <button class="tb-btn" id="btnHomeSearch">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="tb-btn" id="btnSettings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>
        <button class="tb-btn tb-accent" id="btnAddCategory">+</button>
      </div>
    </header>
    <!-- Search bar home -->
    <div class="search-bar" id="homeSearchBar" style="display:none">
      <input type="text" id="homeSearchInput" placeholder="Buscar en todo el catálogo..." autocomplete="off"/>
      <button class="search-close" id="btnHomeSearchClose">✕</button>
    </div>
    <div id="searchResults" class="search-results" style="display:none"></div>
    <div id="categoriesList" class="categories-list"></div>
    <div id="emptyHome" class="empty-state">
      <div class="empty-icon">◎</div>
      <p>Sin categorías</p>
      <span>Toca <strong>+</strong> para crear una</span>
    </div>
  </div>

  <!-- CATEGORY VIEW: PRODUCTS -->
  <div id="viewCategory" class="view">
    <header class="topbar">
      <button class="tb-btn" id="btnBack">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="topbar-title" id="categoryTitle"></span>
      <div class="topbar-actions">
        <button class="tb-btn" id="btnCatSearch">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="tb-btn" id="btnEditCategory">✎</button>
        <button class="tb-btn tb-accent" id="btnAddProduct">+</button>
      </div>
    </header>
    <!-- Search bar category -->
    <div class="search-bar" id="catSearchBar" style="display:none">
      <input type="text" id="catSearchInput" placeholder="Buscar productos..." autocomplete="off"/>
      <button class="search-close" id="btnCatSearchClose">✕</button>
    </div>
    <!-- Status filter -->
    <div class="status-filter">
      <button class="sf-btn active" data-filter="all">Todos</button>
      <button class="sf-btn" data-filter="works">✅ Funciona</button>
      <button class="sf-btn" data-filter="nope">❌ No funciona</button>
      <button class="sf-btn" data-filter="try">🟡 Por probar</button>
    </div>
    <div id="productGrid" class="product-grid"></div>
    <div id="emptyCategory" class="empty-state">
      <div class="empty-icon">◎</div>
      <p>Sin productos</p>
      <span>Toca <strong>+</strong> para agregar uno</span>
    </div>
  </div>

  <!-- PRODUCT DETAIL VIEW -->
  <div id="viewDetail" class="view">
    <header class="topbar">
      <button class="tb-btn" id="btnBackDetail">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="topbar-title" id="detailTitle"></span>
      <div class="topbar-actions">
        <button class="tb-btn" id="btnEditProduct">✎ Editar</button>
      </div>
    </header>
    <div id="detailContent" class="detail-content"></div>
  </div>

  <!-- ===== SHEETS ===== -->

  <!-- Category sheet -->
  <div class="overlay" id="sheetCategory">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="catSheetTitle">Nueva categoría</div>
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="inp-cat-name" placeholder="Ej. Desodorantes, Cremas..." maxlength="40" autocomplete="off"/>
      </div>
      <div id="catDeleteWrap" style="display:none">
        <button class="btn-danger" id="btnDeleteCategory">Eliminar categoría y todos sus productos</button>
      </div>
      <button class="btn-primary" id="btnSaveCategory">Guardar</button>
    </div>
  </div>

  <!-- Product sheet -->
  <div class="overlay" id="sheetProduct">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="prodSheetTitle">Nuevo producto</div>
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="inp-prod-name" placeholder="Nombre del producto..." maxlength="80" autocomplete="off"/>
      </div>
      <div class="field">
        <label>Estado</label>
        <div class="status-picker" id="statusPicker">
          <button class="sp-btn" data-status="works">✅ Funciona</button>
          <button class="sp-btn" data-status="nope">❌ No funciona</button>
          <button class="sp-btn active" data-status="try">🟡 Por probar</button>
        </div>
      </div>
      <div class="field">
        <label>Imagen (opcional)</label>
        <div class="img-tabs">
          <button class="itab active" data-tab="url">URL</button>
          <button class="itab" data-tab="file">Subir foto</button>
        </div>
        <div id="itab-url">
          <input type="url" id="inp-prod-img-url" placeholder="https://imagen..." autocomplete="off"/>
        </div>
        <div id="itab-file" style="display:none">
          <label class="file-area" for="inp-prod-img-file">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span id="prod-file-label">Toca para elegir imagen</span>
            <input type="file" id="inp-prod-img-file" accept="image/*"/>
          </label>
        </div>
        <div id="prod-img-preview-wrap" style="display:none">
          <img id="prod-img-preview" class="img-thumb"/>
          <button class="btn-clear" id="btnClearProdImg">✕ Quitar</button>
        </div>
      </div>
      <div class="field">
        <label>Precio (opcional)</label>
        <input type="text" id="inp-prod-price" placeholder="Ej. $120, 15.99, gratis..." maxlength="30" autocomplete="off"/>
      </div>
      <div class="field">
        <label>Notas (opcional)</label>
        <textarea id="inp-prod-notes" placeholder="Escribe tus comentarios aquí..." rows="3"></textarea>
      </div>
      <div id="prodDeleteWrap" style="display:none">
        <button class="btn-danger" id="btnDeleteProduct">Eliminar producto</button>
      </div>
      <button class="btn-primary" id="btnSaveProduct">Guardar</button>
    </div>
  </div>

  <!-- Settings sheet -->
  <div class="overlay" id="sheetSettings">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Ajustes</div>
      <div class="field">
        <label>Nombre de la app</label>
        <input type="text" id="inp-app-name" placeholder="Catálogo" maxlength="24" autocomplete="off"/>
      </div>
      <div class="field">
        <label>Color de acento</label>
        <div class="color-grid" id="colorGrid"></div>
        <div class="custom-color-row">
          <span>Color personalizado</span>
          <input type="color" id="inp-accent" class="color-picker"/>
        </div>
      </div>
      <div class="field">
        <label>Copia de seguridad</label>
        <button class="btn-secondary" id="btnExport">↓ Exportar</button>
        <button class="btn-secondary btn-sec-accent" id="btnImport" style="margin-top:8px">↑ Importar</button>
        <input type="file" id="inp-backup" accept=".json" style="display:none"/>
        <div class="backup-hint" id="backupHint"></div>
      </div>
      <button class="btn-primary" id="btnSaveSettings">Guardar ajustes</button>
    </div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
